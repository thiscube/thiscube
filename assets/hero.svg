<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" role="img" aria-labelledby="heroTitle">
  <title id="heroTitle">thiscube — developer · builder · perpetual learner</title>

  <defs>
    <style><![CDATA[
      .name {
        font-family: 'Sora', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
        font-weight: 800;
        font-size: 138px;
        letter-spacing: -0.05em;
        fill: url(#nameGrad);
      }
      .caret {
        fill: #a78bfa;
        animation: blink 1.2s ease-in-out infinite;
      }
      .sub {
        font-family: 'Sora', ui-sans-serif, system-ui, -apple-system, sans-serif;
        font-weight: 300;
        font-size: 15px;
        letter-spacing: 0.42em;
        text-transform: uppercase;
        fill: #5e5e74;
      }
      .grid { stroke: #1a1a26; stroke-width: 1; }
      .accent {
        stroke: url(#lineGrad);
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-dasharray: 240;
        stroke-dashoffset: 240;
        animation: draw 2s cubic-bezier(.22,.61,.36,1) 0.6s forwards;
      }
      .orb { animation: float 9s ease-in-out infinite; }
      .orb-b { animation-delay: -3s; }
      .orb-c { animation-delay: -6s; }

      @keyframes blink {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0.18; }
      }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      @keyframes float {
        0%, 100% { transform: translateY(0);     opacity: 0.55; }
        50%      { transform: translateY(-12px); opacity: 0.9;  }
      }
    ]]></style>

    <radialGradient id="bg" cx="50%" cy="45%" r="78%">
      <stop offset="0%"   stop-color="#15152a" />
      <stop offset="100%" stop-color="#08080d" />
    </radialGradient>

    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="40%">
      <stop offset="0%" stop-color="#ffffff">
        <animate attributeName="stop-color"
          values="#ffffff;#e9d5ff;#a78bfa;#7dd3fc;#ffffff"
          dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="55%" stop-color="#c4b5fd">
        <animate attributeName="stop-color"
          values="#c4b5fd;#a78bfa;#7dd3fc;#ffffff;#c4b5fd"
          dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#7dd3fc">
        <animate attributeName="stop-color"
          values="#7dd3fc;#ffffff;#c4b5fd;#a78bfa;#7dd3fc"
          dur="10s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#a78bfa" stop-opacity="0" />
      <stop offset="50%"  stop-color="#a78bfa" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="orbGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#a78bfa" stop-opacity="0.45" />
      <stop offset="60%"  stop-color="#7dd3fc" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)" />

  <g class="grid" opacity="0.55">
    <line x1="0"   y1="80"  x2="1280" y2="80"  />
    <line x1="0"   y1="160" x2="1280" y2="160" />
    <line x1="0"   y1="240" x2="1280" y2="240" />
    <line x1="320" y1="0"   x2="320"  y2="320" />
    <line x1="640" y1="0"   x2="640"  y2="320" />
    <line x1="960" y1="0"   x2="960"  y2="320" />
  </g>

  <circle class="orb"        cx="200"  cy="90"  r="70" fill="url(#orbGrad)" />
  <circle class="orb orb-b"  cx="1090" cy="240" r="90" fill="url(#orbGrad)" />
  <circle class="orb orb-c"  cx="1050" cy="80"  r="50" fill="url(#orbGrad)" />

  <text x="640" y="195" text-anchor="middle"><tspan class="name">thiscube</tspan><tspan class="name caret">|</tspan></text>

  <line class="accent" x1="540" y1="225" x2="740" y2="225" />

  <text x="640" y="262" text-anchor="middle" class="sub">developer · builder · perpetual learner</text>
</svg>
